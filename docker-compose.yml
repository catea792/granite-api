services:
  database:
    image: mysql:8.4
    container_name: granite-db
    command: --innodb-use-native-aio=0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=${DB_NAME:-granite_database}
      - MYSQL_USER=${DB_USER:-granite}
      - MYSQL_PASSWORD=${DB_PASS:-granite_local_password}
      - MYSQL_ROOT_PASSWORD=${DB_PASS:-granite_local_password}
      - TZ=${TZ:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - ${DB_PORT:-3022}:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stdin_open: true
    tty: true
    restart: always
  app:
    container_name: granite-app
    build:
      context: ./docker/php/
      args:
        TZ: ${TZ:-UTC}
        HOST_UID: ${HOST_UID:-1001}
        HOST_GID: ${HOST_GID:-1001}
    ports:
      - ${WEB_PORT:-8868}:8081
    volumes:
      - ${SOURCE:-./src}:/work/app:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/supervisord.conf:/etc/supervisord.conf:ro
      - ./docker/php/supervisord.d:/etc/supervisord.d:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
    working_dir: /work/app
    environment:
      #- DB_CONNECTION=mysql
      #- DB_HOST=database
      #- DB_PORT=3306
      #- DB_DATABASE=${DB_NAME:-granite_database}
      #- DB_USERNAME=${DB_USER:-granite}
      #- DB_PASSWORD=${DB_PASS:-granite_local_password}
      - APP_URL=http://localhost:${WEB_PORT:-8868}
      - TZ=${TZ:-UTC}
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - COMPOSE_PROJECT_NAME=app
    restart: always
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/usr/bin/supervisord", "-n", "-c",  "/etc/supervisord.conf"]

volumes:
  mysql-data:
    name: granite-mysql-data
